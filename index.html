<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pure Ice Food Safety Management System</title>

  <link rel="icon" href="data:,">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --primary: #0b5ed7;
      --primary-dark: #084298;
      --secondary: #0dcaf0;
      --success: #198754;
      --warning: #ffc107;
      --danger: #dc3545;
      --dark: #17202a;
      --text: #263238;
      --muted: #6c757d;
      --border: #dee2e6;
      --bg: #f5f7fa;
      --white: #ffffff;
      --sidebar: #102a43;
      --sidebar-hover: #1d4e73;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .text-muted {
      color: var(--muted);
    }

    .text-success {
      color: var(--success);
    }

    .text-danger {
      color: var(--danger);
    }

    .text-warning {
      color: #9a6700;
    }

    /* =========================
       LOGIN
       ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top right, rgba(13, 202, 240, 0.15), transparent 35%),
        linear-gradient(135deg, #eaf5ff, #f8fbff);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--white);
      border-radius: 18px;
      padding: 38px;
      box-shadow: 0 15px 50px rgba(16, 42, 67, 0.15);
    }

    .login-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 34px;
      font-weight: bold;
    }

    .login-title {
      text-align: center;
      margin-bottom: 5px;
      font-size: 24px;
      font-weight: 700;
      color: var(--dark);
    }

    .login-subtitle {
      text-align: center;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 13px;
      color: var(--dark);
    }

    .form-control {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 14px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.1);
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-warning {
      background: var(--warning);
      color: #212529;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-light {
      background: #f1f3f5;
      color: var(--dark);
    }

    .btn-block {
      width: 100%;
    }

    .login-message {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 13px;
      display: none;
    }

    .login-message.error {
      display: block;
      background: #fcebea;
      color: #b42318;
      border: 1px solid #f5c2c7;
    }

    .login-message.success {
      display: block;
      background: #eaf7ef;
      color: #146c43;
      border: 1px solid #badbcc;
    }

    /* =========================
       APPLICATION
       ========================= */

    #app {
      min-height: 100vh;
      display: none;
    }

    .app-layout {
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 265px;
      flex-shrink: 0;
      background: var(--sidebar);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 1000;
    }

    .brand {
      padding: 20px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    .brand-subtitle {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .user-mini {
      padding: 15px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-mini-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-mini-role {
      font-size: 10px;
      opacity: 0.65;
      margin-top: 2px;
    }

    .nav-section {
      padding: 16px 12px 5px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.45;
      font-weight: 700;
    }

    .nav-menu {
      padding: 0 9px 10px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      padding: 10px 12px;
      margin: 2px 0;
      border-radius: 7px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      transition: all 0.15s;
    }

    .nav-item:hover {
      background: var(--sidebar-hover);
      color: white;
    }

    .nav-item.active {
      background: var(--primary);
      color: white;
    }

    .nav-item .nav-icon {
      width: 22px;
      text-align: center;
      opacity: 0.9;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* MAIN */

    .main-content {
      margin-left: 265px;
      width: calc(100% - 265px);
      min-height: 100vh;
    }

    .topbar {
      height: 65px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 900;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
    }

    .page-subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .content {
      padding: 24px;
    }

    /* =========================
       CARDS
       ========================= */

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .card-header {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
    }

    .card-body {
      padding: 18px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 17px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 700;
      color: var(--dark);
    }

    .stat-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* =========================
       TABLES
       ========================= */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background: #f4f6f8;
      color: #495057;
      font-weight: 700;
      padding: 10px 9px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 10px 9px;
      border-bottom: 1px solid #edf0f2;
      vertical-align: middle;
    }

    tr:hover td {
      background: #fafbfc;
    }

    /* =========================
       BADGES
       ========================= */

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .badge-warning {
      background: #fff3cd;
      color: #664d03;
    }

    .badge-danger {
      background: #f8d7da;
      color: #842029;
    }

    .badge-info {
      background: #cff4fc;
      color: #055160;
    }

    .badge-secondary {
      background: #e2e3e5;
      color: #41464b;
    }

    /* =========================
       TOOLBAR
       ========================= */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-box {
      min-width: 220px;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.25);
    }

    .modal-lg {
      max-width: 1000px;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .modal-close {
      border: 0;
      background: transparent;
      font-size: 24px;
      color: var(--muted);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* =========================
       GRID / FORMS
       ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    /* =========================
       ALERTS
       ========================= */

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      border: 1px solid transparent;
    }

    .alert-info {
      background: #cff4fc;
      border-color: #b6effb;
      color: #055160;
    }

    .alert-success {
      background: #d1e7dd;
      border-color: #badbcc;
      color: #0f5132;
    }

    .alert-warning {
      background: #fff3cd;
      border-color: #ffecb5;
      color: #664d03;
    }

    .alert-danger {
      background: #f8d7da;
      border-color: #f5c2c7;
      color: #842029;
    }

    /* =========================
       MODULE HEADER
       ========================= */

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
    }

    .module-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .module-description {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       EMPTY STATE
       ========================= */

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 38px;
      opacity: 0.35;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 700;
      color: #495057;
      margin-bottom: 5px;
    }

    /* =========================
       LOADING
       ========================= */

    .loading {
      padding: 35px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .spinner {
      width: 25px;
      height: 25px;
      border: 3px solid #e9ecef;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       TOAST
       ========================= */

    #toastContainer {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(360px, calc(100vw - 40px));
    }

    .toast {
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      border-radius: 9px;
      padding: 12px 14px;
      font-size: 13px;
      animation: toastIn 0.2s ease;
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--danger);
    }

    .toast.warning {
      border-left: 4px solid var(--warning);
    }

    .toast.info {
      border-left: 4px solid var(--primary);
    }

    @keyframes toastIn {
      from {
        transform: translateY(10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form-grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 220px;
      }

      .main-content {
        margin-left: 220px;
        width: calc(100% - 220px);
      }

      .content {
        padding: 16px;
      }

      .form-grid,
      .form-grid-3 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        max-height: none;
      }

      .main-content {
        margin-left: 0;
        width: 100%;
      }

      .app-layout {
        display: block;
      }

      .topbar {
        position: relative;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
       ========================= -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="login-logo">
        PI
      </div>

      <div class="login-title">
        Pure Ice
      </div>

      <div class="login-subtitle">
        Food Safety Management System
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            class="form-control"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="loginButton"
        >
          Login
        </button>

      </form>

      <div id="loginMessage" class="login-message"></div>

    </div>

  </section>


  <!-- =========================
       MAIN APPLICATION
       ========================= -->

  <section id="app">

    <div class="app-layout">

      <!-- SIDEBAR -->

      <aside class="sidebar">

        <div class="brand">

          <div class="brand-title">
            PURE ICE
          </div>

          <div class="brand-subtitle">
            Food Safety Management System
          </div>

        </div>


        <div class="user-mini">

          <div
            class="user-avatar"
            id="sidebarAvatar"
          >
            PI
          </div>

          <div style="min-width:0;">

            <div
              class="user-mini-name"
              id="sidebarUserName"
            >
              Quality Officer
            </div>

            <div
              class="user-mini-role"
              id="sidebarUserRole"
            >
              Super Admin
            </div>

          </div>

        </div>


        <div class="nav-section">
          Main
        </div>

        <nav class="nav-menu">

          <button
            class="nav-item active"
            data-module="dashboard"
          >
            <span class="nav-icon">▦</span>
            <span>Dashboard</span>
          </button>

          <button
            class="nav-item"
            data-module="documents"
          >
            <span class="nav-icon">▤</span>
            <span>Document Control</span>
          </button>

          <button
            class="nav-item"
            data-module="records"
          >
            <span class="nav-icon">▥</span>
            <span>Records & Plans</span>
          </button>

        </nav>


        <div class="nav-section">
          Food Safety
        </div>

        <nav class="nav-menu">

          <button
            class="nav-item"
            data-module="haccp"
          >
            <span class="nav-icon">◉</span>
            <span>HACCP / CCP / OPRP</span>
          </button>

          <button
            class="nav-item"
            data-module="gmp"
          >
            <span class="nav-icon">✓</span>
            <span>PRP / GMP / GHP</span>
          </button>

          <button
            class="nav-item"
            data-module="water-ro"
          >
            <span class="nav-icon">◈</span>
            <span>Water & RO</span>
          </button>

          <button
            class="nav-item"
            data-module="calibration"
          >
            <span class="nav-icon">⌁</span>
            <span>Calibration</span>
          </button>

          <button
            class="nav-item"
            data-module="training"
          >
            <span class="nav-icon">▣</span>
            <span>Training</span>
          </button>

          <button
            class="nav-item"
            data-module="suppliers"
          >
            <span class="nav-icon">◫</span>
            <span>Suppliers</span>
          </button>

          <button
            class="nav-item"
            data-module="ncr"
          >
            <span class="nav-icon">!</span>
            <span>NCR / CAPA</span>
          </button>

        </nav>


        <div class="nav-section">
          Management
        </div>

        <nav class="nav-menu">

          <button
            class="nav-item"
            data-module="reports"
          >
            <span class="nav-icon">▥</span>
            <span>Reports</span>
          </button>

          <button
            class="nav-item"
            data-module="settings"
          >
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
          </button>

          <button
            class="nav-item"
            data-module="user-management"
          >
            <span class="nav-icon">♙</span>
            <span>User Management</span>
          </button>

        </nav>


        <div class="sidebar-footer">

          <button
            class="nav-item"
            id="logoutButton"
          >
            <span class="nav-icon">↪</span>
            <span>Logout</span>
          </button>

        </div>

      </aside>


      <!-- MAIN CONTENT -->

      <main class="main-content">

        <header class="topbar">

          <div>

            <div
              class="page-title"
              id="pageTitle"
            >
              Dashboard
            </div>

            <div
              class="page-subtitle"
              id="pageSubtitle"
            >
              Pure Ice Food Safety Management System
            </div>

          </div>


          <div class="topbar-actions">

            <button
              class="btn btn-light"
              id="refreshCurrentModule"
              title="Refresh"
            >
              ↻ Refresh
            </button>

          </div>

        </header>


        <div
          class="content"
          id="mainContent"
        >

          <div class="loading">

            <div class="spinner"></div>

            Loading application...

          </div>

        </div>

      </main>

    </div>

  </section>


  <!-- =========================
       MODAL ROOT
       ========================= -->

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div
      class="modal"
      id="modalContainer"
    >

      <div class="modal-header">

        <div
          class="modal-title"
          id="modalTitle"
        >
          Form
        </div>

        <button
          class="modal-close"
          id="modalClose"
          type="button"
        >
          ×
        </button>

      </div>

      <div
        class="modal-body"
        id="modalBody"
      >
      </div>

      <div
        class="modal-footer"
        id="modalFooter"
      >
      </div>

    </div>

  </div>


  <!-- =========================
       TOAST
       ========================= -->

  <div id="toastContainer"></div>


  <script>

    /* ============================================================
       CONFIGURATION
       ============================================================ */

    if (
      !window.PURE_ICE_CONFIG ||
      !window.PURE_ICE_CONFIG.supabaseUrl ||
      !window.PURE_ICE_CONFIG.supabaseAnonKey
    ) {

      document.body.innerHTML = `
        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:30px;
          background:#f5f7fa;
          font-family:Arial,sans-serif;
        ">
          <div style="
            max-width:600px;
            background:white;
            border:1px solid #ddd;
            border-radius:12px;
            padding:30px;
            box-shadow:0 5px 30px rgba(0,0,0,.08);
          ">
            <h2 style="margin-top:0;color:#dc3545;">
              Configuration Error
            </h2>
            <p>
              The Supabase configuration was not loaded.
            </p>
            <p>
              Make sure that <strong>config.js</strong> is located
              in the same folder as <strong>index.html</strong>.
            </p>
          </div>
        </div>
      `;

      throw new Error("PURE_ICE_CONFIG is missing");

    }


    /* ============================================================
       SUPABASE
       ============================================================ */

    const {
      createClient
    } = window.supabase;

    const supabase = createClient(
      window.PURE_ICE_CONFIG.supabaseUrl,
      window.PURE_ICE_CONFIG.supabaseAnonKey
    );


    /* ============================================================
       APPLICATION STATE
       ============================================================ */

    const appState = {

      currentModule: "dashboard",

      currentUser: null,

      profile: null,

      role: null,

      departments: [],

      users: [],

      documents: [],

      records: [],

      plans: [],

      tasks: [],

      notifications: [],

      currentData: [],

      searchTerm: "",

      loading: false

    };


    /* ============================================================
       DOM HELPERS
       ============================================================ */

    const $ = (id) => document.getElementById(id);


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(value) {

      if (!value) {
        return "-";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString(
        "en-GB",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    function formatDateTime(value) {

      if (!value) {
        return "-";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString(
        "en-GB",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function todayISO() {

      const d = new Date();

      const year = d.getFullYear();

      const month = String(
        d.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        d.getDate()
      ).padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    function showToast(
      message,
      type = "info"
    ) {

      const container = $("toastContainer");

      const toast = document.createElement("div");

      toast.className =
        `toast ${type}`;

      toast.textContent = message;

      container.appendChild(toast);

      setTimeout(
        () => {
          toast.remove();
        },
        4000
      );

    }


    function showLoading(
      message = "Loading..."
    ) {

      $("mainContent").innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          ${escapeHtml(message)}
        </div>
      `;

    }


    function showError(
      message
    ) {

      $("mainContent").innerHTML = `
        <div class="alert alert-danger">
          <strong>Error:</strong>
          ${escapeHtml(message)}
        </div>
      `;

    }


    /* ============================================================
       MODAL
       ============================================================ */

    function openModal({
      title,
      body,
      footer = "",
      large = false
    }) {

      $("modalTitle").textContent = title;

      $("modalBody").innerHTML = body;

      $("modalFooter").innerHTML = footer;

      $("modalContainer")
        .classList.toggle(
          "modal-lg",
          large
        );

      $("modalOverlay")
        .classList.add("show");

    }


    function closeModal() {

      $("modalOverlay")
        .classList.remove("show");

      $("modalBody").innerHTML = "";

      $("modalFooter").innerHTML = "";

    }


    $("modalClose")
      .addEventListener(
        "click",
        closeModal
      );


    $("modalOverlay")
      .addEventListener(
        "click",
        (event) => {

          if (
            event.target ===
            $("modalOverlay")
          ) {
            closeModal();
          }

        }
      );


    /* ============================================================
       BADGES
       ============================================================ */

    function statusBadge(
      status
    ) {

      const normalized =
        String(status || "")
          .toLowerCase();

      let cls =
        "badge-secondary";

      if (
        [
          "active",
          "approved",
          "completed",
          "closed",
          "verified",
          "pass",
          "passed",
          "effective"
        ].includes(normalized)
      ) {
        cls = "badge-success";
      }

      else if (
        [
          "pending",
          "in progress",
          "draft",
          "near expiry",
          "open"
        ].includes(normalized)
      ) {
        cls = "badge-warning";
      }

      else if (
        [
          "expired",
          "rejected",
          "overdue",
          "failed",
          "fail",
          "critical"
        ].includes(normalized)
      ) {
        cls = "badge-danger";
      }

      else if (
        [
          "info",
          "scheduled"
        ].includes(normalized)
      ) {
        cls = "badge-info";
      }

      return `
        <span class="badge ${cls}">
          ${escapeHtml(status || "-")}
        </span>
      `;

    }


    /* ============================================================
       AUTH
       ============================================================ */

    async function login(
      email,
      password
    ) {

      const result =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (result.error) {
        throw result.error;
      }

      return result.data;

    }


    async function logout() {

      await supabase.auth.signOut();

      appState.currentUser = null;

      appState.profile = null;

      appState.role = null;

      $("app").style.display = "none";

      $("loginScreen").style.display = "flex";

    }


    /* ============================================================
       PROFILE
       ============================================================ */

    async function loadProfile() {

      if (!appState.currentUser) {
        return null;
      }

      const {
        data,
        error
      } = await supabase
        .from("profiles")
        .select(`
          *,
          departments (
            id,
            name,
            code
          )
        `)
        .eq(
          "id",
          appState.currentUser.id
        )
        .maybeSingle();

      if (error) {
        throw error;
      }

      appState.profile = data;

      appState.role =
        data?.role ||
        "User";

      return data;

    }


    /* ============================================================
       DEPARTMENTS
       ============================================================ */

    async function loadDepartments() {

      const {
        data,
        error
      } = await supabase
        .from("departments")
        .select("*")
        .order("name");

      if (error) {
        throw error;
      }

      appState.departments =
        data || [];

      return appState.departments;

    }


    /* ============================================================
       USERS
       ============================================================ */

    async function loadUsers() {

      const {
        data,
        error
      } = await supabase
        .from("profiles")
        .select(`
          *,
          departments (
            id,
            name,
            code
          )
        `)
        .order("full_name");

      if (error) {
        throw error;
      }

      appState.users =
        data || [];

      return appState.users;

    }


    /* ============================================================
       DOCUMENTS
       ============================================================ */

    async function loadDocuments() {

      const {
        data,
        error
      } = await supabase
        .from("documents")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

      if (error) {
        throw error;
      }

      appState.documents =
        data || [];

      return appState.documents;

    }


    /* ============================================================
       RECORDS
       ============================================================ */

    async function loadRecords() {

      const {
        data,
        error
      } = await supabase
        .from("records")
        .select(`
          *,
          documents:related_document_id (
            id,
            document_code,
            title
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );

      if (error) {
        throw error;
      }

      appState.records =
        data || [];

      return appState.records;

    }


    /* ============================================================
       PLANS
       ============================================================ */

    async function loadPlans() {

      const {
        data,
        error
      } = await supabase
        .from("compliance_plans")
        .select(`
          *,
          sop:sop_document_id (
            id,
            document_code,
            title
          ),
          record:record_id (
            id,
            record_code,
            title
          ),
          responsible:responsible_id (
            id,
            full_name,
            email
          ),
          verifier:verifier_id (
            id,
            full_name,
            email
          )
        `)
        .order(
          "next_due_date",
          {
            ascending: true
          }
        );

      if (error) {
        throw error;
      }

      appState.plans =
        data || [];

      return appState.plans;

    }


    /* ============================================================
       TASKS
       ============================================================ */

    async function loadTasks() {

      const {
        data,
        error
      } = await supabase
        .from("compliance_tasks")
        .select(`
          *,
          plan:plan_id (
            id,
            plan_code,
            title,
            frequency
          ),
          responsible:responsible_id (
            id,
            full_name
          ),
          verifier:verifier_id (
            id,
            full_name
          )
        `)
        .order(
          "due_date",
          {
            ascending: true
          }
        );

      if (error) {
        throw error;
      }

      appState.tasks =
        data || [];

      return appState.tasks;

    }


    /* ============================================================
       AUDIT LOG
       ============================================================ */

    async function writeAuditLog({
      action,
      module,
      tableName,
      recordId,
      description,
      oldData = null,
      newData = null
    }) {

      try {

        await supabase
          .from("fsms_audit_log")
          .insert({
            user_id:
              appState.currentUser?.id ||
              null,

            action,

            module,

            table_name:
              tableName || null,

            record_id:
              recordId || null,

            description:
              description || null,

            old_data:
              oldData,

            new_data:
              newData
          });

      }

      catch (error) {

        console.warn(
          "Audit log error:",
          error
        );

      }

    }


    /* ============================================================
       ROLE ACCESS
       ============================================================ */

    function applyRoleAccess() {

      const allowed =
        [
          "dashboard",
          "documents",
          "records",
          "haccp",
          "gmp",
          "water-ro",
          "calibration",
          "training",
          "suppliers",
          "ncr",
          "reports",
          "settings",
          "user-management"
        ];

      document
        .querySelectorAll(
          ".nav-item[data-module]"
        )
        .forEach(
          button => {

            const module =
              button.dataset.module;

            const isAllowed =
              allowed.includes(module);

            button.style.display =
              isAllowed
                ? "flex"
                : "none";

          }
        );

    }


    /* ============================================================
       SIDEBAR USER
       ============================================================ */

    function updateSidebarUser() {

      const profile =
        appState.profile;

      const name =
        profile?.full_name ||
        appState.currentUser?.email ||
        "User";

      const role =
        profile?.role ||
        "User";

      $("sidebarUserName")
        .textContent = name;

      $("sidebarUserRole")
        .textContent = role;

      const initials =
        name
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map(
            part =>
              part
                .charAt(0)
                .toUpperCase()
          )
          .join("");

      $("sidebarAvatar")
        .textContent =
        initials || "PI";

    }


    /* ============================================================
       NAVIGATION
       ============================================================ */

    function setActiveNav(
      module
    ) {

      document
        .querySelectorAll(
          ".nav-item[data-module]"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.module === module
            );

          }
        );

    }


    function setPageHeader(
      title,
      subtitle
    ) {

      $("pageTitle")
        .textContent = title;

      $("pageSubtitle")
        .textContent =
        subtitle ||
        "Pure Ice Food Safety Management System";

    }


    async function navigate(
      module
    ) {

      appState.currentModule =
        module;

      appState.searchTerm = "";

      setActiveNav(module);

      try {

        switch (module) {

          case "dashboard":
            await renderDashboard();
            break;

          case "documents":
            await renderDocuments();
            break;

          case "records":
            await renderRecords();
            break;

          case "haccp":
            await renderHaccp();
            break;

          case "gmp":
            await renderGmp();
            break;

          case "water-ro":
            await renderWaterRo();
            break;

          case "calibration":
            await renderCalibration();
            break;

          case "training":
            await renderTraining();
            break;

          case "suppliers":
            await renderSuppliers();
            break;

          case "ncr":
            await renderNcr();
            break;

          case "reports":
            await renderReports();
            break;

          case "settings":
            await renderSettings();
            break;

          case "user-management":
            await renderUserManagement();
            break;

          default:
            await renderDashboard();

        }

      }

      catch (error) {

        console.error(
          "Navigation error:",
          error
        );

        showError(
          error.message ||
          "Unable to load module."
        );

      }

    }


    /* ============================================================
       DASHBOARD
       ============================================================ */

    async function renderDashboard() {

      setPageHeader(
        "Dashboard",
        "Food Safety Management System overview"
      );

      showLoading(
        "Loading dashboard..."
      );

      await Promise.all([
        loadDocuments(),
        loadRecords(),
        loadPlans(),
        loadTasks()
      ]);

      const documents =
        appState.documents;

      const records =
        appState.records;

      const plans =
        appState.plans;

      const tasks =
        appState.tasks;

      const today =
        todayISO();

      const overdueTasks =
        tasks.filter(
          task =>
            task.status !== "Completed" &&
            task.due_date &&
            task.due_date < today
        );

      const dueToday =
        tasks.filter(
          task =>
            task.status !== "Completed" &&
            task.due_date === today
        );

      const completedTasks =
        tasks.filter(
          task =>
            task.status === "Completed"
        );

      const activePlans =
        plans.filter(
          plan =>
            plan.status === "Active"
        );

      $("mainContent").innerHTML = `

        <div class="module-header">

          <div>

            <div class="module-heading">
              Food Safety Dashboard
            </div>

            <div class="module-description">
              Real-time overview of Pure Ice FSMS activities.
            </div>

          </div>

          <div>
            ${statusBadge("Active")}
          </div>

        </div>


        <div class="stats-grid">

          <div class="stat-card">

            <div class="stat-label">
              Controlled Documents
            </div>

            <div class="stat-value">
              ${documents.length}
            </div>

            <div class="stat-note">
              Document Control
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              Active Plans
            </div>

            <div class="stat-value">
              ${activePlans.length}
            </div>

            <div class="stat-note">
              Compliance Plans
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              Due Today
            </div>

            <div class="stat-value">
              ${dueToday.length}
            </div>

            <div class="stat-note">
              Scheduled activities
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              Overdue
            </div>

            <div class="stat-value ${overdueTasks.length ? "text-danger" : "text-success"}">
              ${overdueTasks.length}
            </div>

            <div class="stat-note">
              Tasks requiring action
            </div>

          </div>

        </div>


        <div class="card">

          <div class="card-header">

            <div class="card-title">
              Compliance Task Overview
            </div>

            <button
              class="btn btn-light"
              onclick="navigate('records')"
            >
              View Records & Plans
            </button>

          </div>

          <div class="card-body">

            <div class="stats-grid" style="margin-bottom:0;">

              <div class="stat-card">

                <div class="stat-label">
                  Total Tasks
                </div>

                <div class="stat-value">
                  ${tasks.length}
                </div>

              </div>

              <div class="stat-card">

                <div class="stat-label">
                  Completed
                </div>

                <div class="stat-value text-success">
                  ${completedTasks.length}
                </div>

              </div>

              <div class="stat-card">

                <div class="stat-label">
                  Due Today
                </div>

                <div class="stat-value text-warning">
                  ${dueToday.length}
                </div>

              </div>

              <div class="stat-card">

                <div class="stat-label">
                  Overdue
                </div>

                <div class="stat-value text-danger">
                  ${overdueTasks.length}
                </div>

              </div>

            </div>

          </div>

        </div>


        <div class="card">

          <div class="card-header">

            <div class="card-title">
              Upcoming Activities
            </div>

          </div>

          <div class="card-body">

            ${
              tasks.length
                ? `
                  <div class="table-wrapper">

                    <table>

                      <thead>

                        <tr>
                          <th>Task</th>
                          <th>Plan</th>
                          <th>Due Date</th>
                          <th>Responsible</th>
                          <th>Status</th>
                        </tr>

                      </thead>

                      <tbody>

                        ${
                          tasks
                            .slice(0, 10)
                            .map(
                              task => `

                                <tr>

                                  <td>
                                    ${escapeHtml(
                                      task.task_number || "-"
                                    )}
                                  </td>

                                  <td>
                                    ${escapeHtml(
                                      task.plan?.title ||
                                      "-"
                                    )}
                                  </td>

                                  <td>
                                    ${formatDate(
                                      task.due_date
                                    )}
                                  </td>

                                  <td>
                                    ${escapeHtml(
                                      task.responsible?.full_name ||
                                      "-"
                                    )}
                                  </td>

                                  <td>
                                    ${statusBadge(
                                      task.status
                                    )}
                                  </td>

                                </tr>

                              `
                            )
                            .join("")
                        }

                      </tbody>

                    </table>

                  </div>
                `
                : `
                  <div class="empty-state">

                    <div class="empty-icon">
                      ✓
                    </div>

                    <div class="empty-title">
                      No scheduled tasks
                    </div>

                    <div>
                      Create a Compliance Plan to generate activities.
                    </div>

                  </div>
                `
            }

          </div>

        </div>

      `;

    }


    /* ============================================================
       DOCUMENT CONTROL
       ============================================================ */

    async function renderDocuments() {

      setPageHeader(
        "Document Control",
        "Controlled documents, SOPs, policies and procedures"
      );

      showLoading(
        "Loading documents..."
      );

      await loadDocuments();

      $("mainContent").innerHTML = `

        <div class="module-header">

          <div>

            <div class="module-heading">
              Document Control
            </div>

            <div class="module-description">
              Manage controlled SOPs, policies, procedures and supporting documents.
            </div>

          </div>

          <button
            class="btn btn-primary"
            onclick="openDocumentForm()"
          >
            + Add Document
          </button>

        </div>


        <div class="card">

          <div class="card-body">

            <div class="toolbar">

              <div class="toolbar-left">

                <input
                  type="search"
                  class="form-control search-box"
                  id="documentSearch"
                  placeholder="Search documents..."
                  oninput="filterDocuments(this.value)"
                >

              </div>

              <div class="toolbar-right">

                <span class="text-muted">
                  ${documentsCountText()}
                </span>

              </div>

            </div>


            <div id="documentsTable">
              ${documentsTableHtml(appState.documents)}
            </div>

          </div>

        </div>

      `;

    }


    function documentsCountText() {

      return `${appState.documents.length} document(s)`;

    }


    function filterDocuments(
      term
    ) {

      const normalized =
        String(term || "")
          .trim()
          .toLowerCase();

      const filtered =
        appState.documents.filter(
          document => {

            const text =
              [
                document.document_code,
                document.title,
                document.document_type,
                document.department,
                document.revision,
                document.status
              ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            return text.includes(
              normalized
            );

          }
        );

      $("documentsTable").innerHTML =
        documentsTableHtml(filtered);

    }


    function documentsTableHtml(
      documents
    ) {

      if (!documents.length) {

        return `
          <div class="empty-state">

            <div class="empty-icon">
              ▤
            </div>

            <div class="empty-title">
              No documents found
            </div>

            <div>
              Add the first controlled document.
            </div>

          </div>
        `;

      }

      return `

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>Code</th>
                <th>Title</th>
                <th>Type</th>
                <th>Department</th>
                <th>Revision</th>
                <th>Review Date</th>

    /* ============================================================
       DOCUMENT SAVE
       ============================================================ */

    async function saveDocument(
      documentId
    ) {

      const form =
        $("documentForm");

      if (!form.reportValidity()) {
        return;
      }

      try {

        const file =
          $("docFile").files[0];

        let filePath =
          null;

        let fileName =
          null;

        let fileSize =
          null;

        let fileType =
          null;


        if (documentId) {

          const existing =
            appState.documents.find(
              item =>
                item.id === documentId
            );

          filePath =
            existing?.file_path ||
            null;

          fileName =
            existing?.file_name ||
            null;

          fileSize =
            existing?.file_size ||
            null;

          fileType =
            existing?.file_type ||
            null;

        }


        if (file) {

          const safeName =
            file.name
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );

          const path =
            `${appState.currentUser.id}/${Date.now()}_${safeName}`;

          const upload =
            await supabase
              .storage
              .from("fsms-documents")
              .upload(
                path,
                file,
                {
                  upsert: false
                }
              );

          if (upload.error) {
            throw upload.error;
          }

          filePath =
            path;

          fileName =
            file.name;

          fileSize =
            file.size;

          fileType =
            file.type || null;

        }


        const payload = {

          document_code:
            $("docCode").value.trim(),

          title:
            $("docTitle").value.trim(),

          document_type:
            $("docType").value,

          department:
            $("docDepartment").value.trim() ||
            null,

          revision:
            $("docRevision").value.trim() ||
            "00",

          issue_date:
            $("docIssueDate").value ||
            null,

          review_date:
            $("docReviewDate").value ||
            null,

          status:
            $("docStatus").value,

          approval_status:
            $("docApprovalStatus").value,

          description:
            $("docDescription").value.trim() ||
            null,

          file_path:
            filePath,

          file_name:
            fileName,

          file_size:
            fileSize,

          file_type:
            fileType,

          updated_at:
            new Date().toISOString()

        };


        let result;


        if (documentId) {

          result =
            await supabase
              .from("documents")
              .update(payload)
              .eq(
                "id",
                documentId
              )
              .select()
              .single();

        }

        else {

          payload.created_by =
            appState.currentUser.id;

          payload.owner_id =
            appState.currentUser.id;

          result =
            await supabase
              .from("documents")
              .insert(payload)
              .select()
              .single();

        }


        if (result.error) {
          throw result.error;
        }


        await writeAuditLog({

          action:
            documentId
              ? "UPDATE"
              : "CREATE",

          module:
            "Document Control",

          tableName:
            "documents",

          recordId:
            result.data.id,

          description:
            documentId
              ? `Document updated: ${result.data.title}`
              : `Document created: ${result.data.title}`,

          newData:
            result.data

        });


        closeModal();

        showToast(
          documentId
            ? "Document updated successfully."
            : "Document created successfully.",
          "success"
        );

        await renderDocuments();

      }

      catch (error) {

        console.error(
          "Save document error:",
          error
        );

        showToast(
          error.message ||
          "Unable to save document.",
          "error"
        );

      }

    }


    /* ============================================================
       DOCUMENT VIEW
       ============================================================ */

    async function viewDocumentFile(
      documentId
    ) {

      try {

        const document =
          appState.documents.find(
            item =>
              item.id === documentId
          );

        if (
          !document ||
          !document.file_path
        ) {

          showToast(
            "No file is attached to this document.",
            "warning"
          );

          return;

        }


        const result =
          await supabase
            .storage
            .from("fsms-documents")
            .createSignedUrl(
              document.file_path,
              3600
            );

        if (result.error) {
          throw result.error;
        }

        window.open(
          result.data.signedUrl,
          "_blank"
        );

      }

      catch (error) {

        console.error(
          "View document error:",
          error
        );

        showToast(
          error.message ||
          "Unable to open document.",
          "error"
        );

      }

    }


    /* ============================================================
       DOCUMENT APPROVAL
       ============================================================ */

    async function approveDocument(
      documentId
    ) {

      if (
        !confirm(
          "Approve this document?"
        )
      ) {
        return;
      }

      try {

        const result =
          await supabase
            .from("documents")
            .update({
              approval_status:
                "Approved",

              approved_by:
                appState.currentUser.id,

              approved_at:
                new Date().toISOString(),

              status:
                "Active",

              updated_at:
                new Date().toISOString()
            })
            .eq(
              "id",
              documentId
            )
            .select()
            .single();

        if (result.error) {
          throw result.error;
        }

        await writeAuditLog({

          action:
            "APPROVE",

          module:
            "Document Control",

          tableName:
            "documents",

          recordId:
            documentId,

          description:
            `Document approved: ${result.data.title}`,

          newData:
            result.data

        });

        showToast(
          "Document approved.",
          "success"
        );

        await renderDocuments();

      }

      catch (error) {

        console.error(
          error
        );

        showToast(
          error.message ||
          "Unable to approve document.",
          "error"
        );

      }

    }

      documentId

      if (

      ) {

      try {

          appState.documents.find(
            item =>
              item.id === documentId
          );

        const result =
          await supabase
            .from("documents")
            .delete()
            .eq(
              "id",
              documentId
            );

        if (result.error) {
          throw result.error;
        }


        await writeAuditLog({

          action:
            "DELETE",

          module:
            "Document Control",

          tableName:
            "documents",

          recordId:
            documentId,

          description:
            `Document deleted: ${document?.title || documentId}`,

          oldData:
            document || null

        });


        showToast(
          "Document deleted.",

        await renderDocuments();

      catch (error) {

        console.error(

        );

        showToast(

          "error"
        );

      }

    }

    /* ============================================================
       SAVE RECORD
       ============================================================ */

    async function saveRecord(
      recordId
    ) {

      const form =
        $("recordForm");

      if (!form.reportValidity()) {
        return;
      }

      try {

        const existing =
          recordId
            ? appState.records.find(
                item =>
                  item.id === recordId
              )
            : null;

        const file =
          $("recordFile").files[0];

        let filePath =
          existing?.file_path ||
          null;

        let fileName =
          existing?.file_name ||
          null;

        let fileSize =
          existing?.file_size ||
          null;

        let fileType =
          existing?.file_type ||
          null;


        if (file) {

          const safeName =
            file.name
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );

          const path =
            `${appState.currentUser.id}/records/${Date.now()}_${safeName}`;

          const upload =
            await supabase
              .storage
              .from("fsms-documents")
              .upload(
                path,
                file,
                {
                  upsert: false
                }
              );

          if (upload.error) {
            throw upload.error;
          }

          filePath =
            path;

          fileName =
            file.name;

          fileSize =
            file.size;

          fileType =
            file.type || null;

        }


        const payload = {

          record_code:
            $("recordCode").value.trim(),

          title:
            $("recordTitle").value.trim(),

          record_type:
            $("recordType").value,

          department:
            $("recordDepartment").value.trim() ||
            null,

          related_document_id:
            $("recordDocument").value ||
            null,

          frequency:
            $("recordFrequency").value ||
            null,

          status:
            $("recordStatus").value,

          issue_date:
            $("recordIssueDate").value ||
            null,

          review_date:
            $("recordReviewDate").value ||
            null,

          file_name:
            fileName,

          file_path:
            filePath,

          file_size:
            fileSize,

          file_type:
            fileType,

          description:
            $("recordDescription").value.trim() ||
            null,

          updated_at:
            new Date().toISOString()

        };


        let result;


        if (recordId) {

          result =
            await supabase
              .from("records")
              .update(payload)
              .eq(
                "id",
                recordId
              )
              .select()
              .single();

        }

        else {

          payload.created_by =
            appState.currentUser.id;

          payload.owner_id =
            appState.currentUser.id;

          result =
            await supabase
              .from("records")
              .insert(payload)
              .select()
              .single();

        }


        if (result.error) {
          throw result.error;
        }


        await writeAuditLog({

          action:
            recordId
              ? "UPDATE"
              : "CREATE",

          module:
            "Records",

          tableName:
            "records",

          recordId:
            result.data.id,

          description:
            recordId
              ? `Record updated: ${result.data.title}`
              : `Record created: ${result.data.title}`,

          newData:
            result.data

        });


        closeModal();

        showToast(
          recordId
            ? "Record updated successfully."
            : "Record created successfully.",
          "success"
        );

        await renderRecords();

      }

      catch (error) {

        console.error(
          "Save record error:",
          error
        );

        showToast(
          error.message ||
          "Unable to save record.",
          "error"
        );

      }

    }

    async function viewRecordFile(
      recordId
    ) {

      try {

        const record =
          appState.records.find(
            item =>
              item.id === recordId
          );

        if (
          !record ||
          !record.file_path
        ) {

          showToast(
            "No file is attached to this record.",
            "warning"
          );

          return;

        }


        const result =
          await supabase
            .storage
            .from("fsms-documents")
            .createSignedUrl(
              record.file_path,
              3600
            );

        if (result.error) {
          throw result.error;
        }

        window.open(
          result.data.signedUrl,
          "_blank"
        );

      }

      catch (error) {

        showToast(
          error.message ||
          "Unable to open record.",
          "error"
        );

      }

    }


    /* ============================================================
       DELETE RECORD
       ============================================================ */

    async function deleteRecord(
      recordId
    ) {

      if (
        !confirm(
          "Delete this record?"
        )
      ) {
        return;
      }

      try {

        const record =
          appState.records.find(
            item =>
              item.id === recordId
          );

        const result =
          await supabase
            .from("records")
            .delete()
            .eq(
              "id",
              recordId
            );

        if (result.error) {
          throw result.error;
        }


        await writeAuditLog({

          action:
            "DELETE",

          module:
            "Records",

          tableName:
            "records",

          recordId,

          description:
            `Record deleted: ${record?.title || recordId}`,

          oldData:
            record || null

        });


        showToast(
          "Record deleted.",
          "success"
        );

        await renderRecords();

      }

      catch (error) {

        showToast(
          error.message ||
          "Unable to delete record.",
          "error"
        );

      }

    }

          status:

        const result =

        await writeAuditLog({

          action:
            "CREATE",

          module:
            "Compliance Tasks",

          tableName:

          recordId:
            result.data.id,

        showToast(

      catch (error) {

    async function renderGenericModule(

    ) {

      const config =
        MODULE_CONFIG[moduleKey];

      if (!config) {
        throw new Error(
          "Module configuration not found."
        );
      }

      setPageHeader(
        config.title,
        config.subtitle
      );

      showLoading(
        `Loading ${config.title}...`
      );


      const result =
        await supabase
          .from(config.table)
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (result.error) {
        throw result.error;
      }


      const rows =
        result.data || [];


      $("mainContent").innerHTML = `

        <div class="module-header">

          <div>

            <div class="module-heading">
              ${escapeHtml(
                config.title
              )}
            </div>

            <div class="module-description">
              ${escapeHtml(
                config.subtitle
              )}
            </div>

          </div>

          <button
            class="btn btn-primary"
            onclick="openGenericForm('${moduleKey}')"
          >
            + Add Record
          </button>

        </div>


        <div class="card">

          <div class="card-body">

            <div class="toolbar">

              <div class="toolbar-left">

                <input
                  type="search"
                  class="form-control search-box"
                  placeholder="Search..."
                  oninput="filterGenericModule('${moduleKey}', this.value)"
                >

              </div>

              <div class="toolbar-right">

                <span class="text-muted">
                  ${rows.length} record(s)
                </span>

              </div>

            </div>


            <div id="genericTable">
              ${genericTableHtml(
                moduleKey,
                rows
              )}
            </div>

          </div>

        </div>

      `;

    }


    function genericTableHtml(
      moduleKey,
      rows
    ) {

      const config =
        MODULE_CONFIG[moduleKey];

      if (!rows.length) {

        return `
          <div class="empty-state">

            <div class="empty-icon">
              ▥
            </div>

            <div class="empty-title">
              No records found
            </div>

            <div>
              Add the first record for this module.
            </div>

          </div>
        `;

      }


      return `

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                ${config.columns
                  .map(
                    column => `
                      <th>
                        ${escapeHtml(
                          column[1]
                        )}
                      </th>
                    `
                  )
                  .join("")}

                <th>
                  Actions
                </th>

              </tr>

            </thead>


            <tbody>

              ${rows.map(
                row => `

                  <tr>

                    ${config.columns
                      .map(
                        column => {

                          const key =
                            column[0];

                          const value =
                            row[key];

                          let display =
                            value;

                          if (
                            key.includes(
                              "date"
                            )
                          ) {
                            display =
                              formatDate(
                                value
                              );
                          }

                          if (
                            key === "status"
                          ) {
                            display =
                              statusBadge(
                                value
                              );
                          }

                          if (
                            typeof value ===
                            "boolean"
                          ) {
                            display =
                              value
                                ? "Yes"
                                : "No";
                          }

                          return `
                            <td>
                              ${
                                typeof display === "string" &&
                                display.startsWith("<span")
                                  ? display
                                  : escapeHtml(
                                      display ??
                                      "-"
                                    )
                              }
                            </td>
                          `;

                        }
                      )
                      .join("")}

                    <td>

                      <div style="
                        display:flex;
                        gap:5px;
                        flex-wrap:wrap;
                      ">

                        <button
                          class="btn btn-light"
                          onclick="openGenericForm('${moduleKey}', '${row.id}')"
                        >
                          Edit
                        </button>

                        <button
                          class="btn btn-danger"
                          onclick="deleteGenericRecord('${moduleKey}', '${row.id}')"
                        >
                          Delete
                        </button>

                      </div>

                    </td>

                  </tr>

                `
              ).join("")}

            </tbody>

          </table>

        </div>

      `;

    }


    async function filterGenericModule(
      moduleKey,
      term
    ) {

      const config =
        MODULE_CONFIG[moduleKey];

      const normalized =
        String(term || "")
          .toLowerCase()
          .trim();


      const result =
        await supabase
          .from(config.table)
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (result.error) {

        showToast(
          result.error.message,
          "error"
        );

        return;

      }


      const filtered =
        (result.data || [])
          .filter(
            row =>
              Object.values(row)
                .join(" ")
                .toLowerCase()
                .includes(normalized)
          );


      $("genericTable").innerHTML =
        genericTableHtml(
          moduleKey,
          filtered
        );

    }

              .from(config.table)

          : {

    /* ============================================================
       SAVE GENERIC RECORD
       ============================================================ */

    async function saveGenericRecord(
      moduleKey,
      recordId
    ) {

      const config =
        MODULE_CONFIG[moduleKey];

      const form =
        $("genericForm");

      if (!form.reportValidity()) {
        return;
      }


      try {

        const fieldNames =
          getGenericFieldNames(
            moduleKey
          );


        const payload = {};


        fieldNames.forEach(
          field => {

            const element =
              $(field);

            if (!element) {
              return;
            }

            let value =
              element.value;

            if (
              [
                "attendees_count",
                "score",
                "feed_tds",
                "permeate_tds",
                "chlorine",
                "ph"
              ].includes(field)
            ) {

              value =
                value === ""
                  ? null
                  : Number(value);

            }

            payload[field] =
              value === ""
                ? null
                : value;

          }
        );


        let result;


        if (recordId) {

          result =
            await supabase
              .from(config.table)
              .update(payload)
              .eq(
                "id",
                recordId
              )
              .select()
              .single();

        }

        else {

          payload.created_by =
            appState.currentUser.id;

          result =
            await supabase
              .from(config.table)
              .insert(payload)
              .select()
              .single();

        }


        if (result.error) {
          throw result.error;
        }


        await writeAuditLog({

          action:
            recordId
              ? "UPDATE"
              : "CREATE",

          module:
            config.title,

          tableName:
            config.table,

          recordId:
            result.data.id,

          description:
            recordId
              ? `${config.title} record updated`
              : `${config.title} record created`,

          newData:
            result.data

        });


        closeModal();

        showToast(
          recordId
            ? "Record updated successfully."
            : "Record created successfully.",
          "success"
        );

        await renderGenericModule(
          moduleKey
        );

      }

      catch (error) {

        console.error(
          "Generic save error:",
          error
        );

        showToast(
          error.message ||
          "Unable to save record.",
          "error"
        );

      }

    }

    /* ============================================================
       DELETE GENERIC RECORD
       ============================================================ */

    async function deleteGenericRecord(
      moduleKey,
      recordId
    ) {

      const config =
        MODULE_CONFIG[moduleKey];

      if (
        !confirm(
          `Delete this ${config.title} record?`
        )
      ) {
        return;
      }


      try {

        const existing =
          await supabase
            .from(config.table)
            .select("*")
            .eq(
              "id",
              recordId
            )
            .single();


        const result =
          await supabase
            .from(config.table)
            .delete()
            .eq(
              "id",
              recordId
            );


        if (result.error) {
          throw result.error;
        }


        await writeAuditLog({

          action:
            "DELETE",

          module:
            config.title,

          tableName:
            config.table,

          recordId,

          description:
            `${config.title} record deleted`,

          oldData:
            existing.data ||
            null

        });


        showToast(
          "Record deleted successfully.",
          "success"
        );

        await renderGenericModule(
          moduleKey
        );

      }

      catch (error) {

        showToast(
          error.message ||
          "Unable to delete record.",
          "error"
        );

      }

    }
