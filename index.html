/* =========================
   BASIC HELPERS
========================= */

function setStatus(id,message,type='info'){

  const el=document.getElementById(id);

  if(!el)return;

  el.textContent=message||'';

  el.className='status '+type;

}


function escapeHtml(value){

  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function formatDate(value){

  if(!value)return '—';

  const d=new Date(value);

  if(Number.isNaN(d.getTime()))return '—';

  return d.toLocaleDateString('en-GB');

}


function safeNumber(value){

  return Number.isFinite(Number(value))
    ? Number(value)
    : 0;

}


function todayIso(){

  const d=new Date();

  const year=d.getFullYear();

  const month=String(d.getMonth()+1).padStart(2,'0');

  const day=String(d.getDate()).padStart(2,'0');

  return `${year}-${month}-${day}`;

}


function daysFromToday(dateValue){

  if(!dateValue)return null;

  const today=new Date(todayIso()+'T00:00:00');

  const date=new Date(dateValue+'T00:00:00');

  return Math.ceil((date-today)/86400000);

}


function reviewClass(dateValue){

  const days=daysFromToday(dateValue);

  if(days===null)return 'pill info';

  if(days<0)return 'pill bad';

  if(days<=30)return 'pill warn';

  return 'pill';

}


function statusClass(status){

  if(status==='Active')return 'pill';

  if(status==='Obsolete')return 'pill bad';

  if(status==='Under Review')return 'pill warn';

  return 'pill info';

}


function approvalClass(status){

  if(status==='Approved')return 'pill';

  if(status==='Rejected')return 'pill bad';

  if(status==='Pending Approval')return 'pill warn';

  return 'pill info';

}

/* =========================

async function loadProfile(sessionUser){

  if(!sessionUser || !appState.supabase)return null;

  try{

    const {data,error}=await appState.supabase
      .from('profiles')
      .select('*')
      .eq('id',sessionUser.id)
      .maybeSingle();

    if(error){

      console.warn(
        '[loadProfile] Profile query:',
        error.message
      );

    }

    if(data){

      appState.profile=data;

      appState.role=data.role||'Auditor / Read Only';

      console.log(
        '[loadProfile] Found profile in database:',
        data
      );

    }else{

      appState.profile={

        id:sessionUser.id,

        full_name:
          sessionUser.user_metadata?.full_name ||
          sessionUser.email?.split('@')[0] ||
          'Pure Ice User',

        email:sessionUser.email,

        role:'Auditor / Read Only',

        status:'active'

      };

      appState.role='Auditor / Read Only';

      console.warn(
        '[loadProfile] No profile found.'
      );

    }

    applyRoleAccess();

    return appState.profile;

  }catch(error){

    console.error(
      '[loadProfile] Error:',
      error
    );

    appState.role='Auditor / Read Only';

    applyRoleAccess();

    return null;

  }

}


function applyRoleAccess(){

  const allowed=
    ROLE_ACCESS[appState.role] ||
    ROLE_ACCESS['Auditor / Read Only'];

  document.querySelectorAll('.nav').forEach(button=>{

    const module=button.dataset.module;

    const isAllowed=
      allowed.includes(module);

    button.disabled=!isAllowed;

    button.setAttribute(
      'aria-disabled',
      String(!isAllowed)
    );

  });

  const profileButton=
    document.getElementById('profile-button');

  if(profileButton){

    profileButton.textContent=
      appState.profile?.full_name ||
      'Profile';

  }

  console.log(
    '[applyRoleAccess] Current role:',
    appState.role
  );

  console.log(
    '[applyRoleAccess] Allowed modules:',
    allowed
  );

}

function hideAllSections(){

  const sections=[

    '#dashboard-section',

    '#documents-section',

    '#records-section',

    '#user-management-section',

    '#module-placeholder-section'

  ];

  sections.forEach(selector=>{

    const el=document.querySelector(selector);

    if(el)
      el.classList.add('hidden');

  });

}


function switchModule(moduleName){

  if(!moduleName)return;

  const allowed=
    ROLE_ACCESS[appState.role] ||
    ROLE_ACCESS['Auditor / Read Only'];

  if(!allowed.includes(moduleName)){

    console.warn(
      '[switchModule] Access denied:',
      moduleName
    );

    return;

  }


  appState.currentModule=moduleName;


  hideAllSections();


  document
    .querySelectorAll('.nav')
    .forEach(btn=>{
      btn.classList.remove('active');
    });


  const activeButton=
    document.querySelector(
      `.nav[data-module="${CSS.escape(moduleName)}"]`
    );


  if(activeButton)
    activeButton.classList.add('active');


  const title=
    document.getElementById('page-title');

  const subtitle=
    document.getElementById('page-subtitle');


  if(title)
    title.textContent=
      MODULE_NAMES[moduleName]||'Module';


  if(subtitle)
    subtitle.textContent=
      MODULE_SUBTITLES[moduleName]||
      'Pure Ice Food Safety Management System';


  if(moduleName==='dashboard'){

    const section=
      document.getElementById('dashboard-section');

    if(section)
      section.classList.remove('hidden');

    refreshDashboard();

    return;

  }


  if(moduleName==='documents'){

    const section=
      document.getElementById('documents-section');

    if(section)
      section.classList.remove('hidden');

    loadDocuments();

    return;

  }


  if(moduleName==='records'){

    const section=
      document.getElementById('records-section');

    if(section)
      section.classList.remove('hidden');

    return;

  }


  if(moduleName==='user-management'){

    const section=
      document.getElementById('user-management-section');

    if(section)
      section.classList.remove('hidden');

    loadUsers();

    return;

  }


  const placeholder=
    document.getElementById(
      'module-placeholder-section'
    );

  if(placeholder)
    placeholder.classList.remove('hidden');


  const placeholderTitle=
    document.getElementById(
      'placeholder-title'
    );

  if(placeholderTitle)
    placeholderTitle.textContent=
      MODULE_NAMES[moduleName]||'Module';


  const placeholderText=
    document.getElementById(
      'placeholder-text'
    );

  if(placeholderText){

    placeholderText.textContent=
      'This module is part of the Pure Ice Food Safety Management System. The operational workflow will be connected to the FSMS engine in the next implementation phase.';

  }

}

/* =========================
   AUDIT LOG
========================= */

async function writeAudit(
  action,
  module,
  tableName,
  recordId,
  description,
  oldData=null,
  newData=null
){

  if(!appState.supabase)return;

  try{

    const payload={

      user_id:
        appState.profile?.id||
        appState.session?.user?.id||
        null,

      action,

      module,

      table_name:tableName,

      record_id:recordId||null,

      description,

      old_data:oldData,

      new_data:newData

    };


    const {error}=
      await appState.supabase
        .from('fsms_audit_log')
        .insert(payload);


    if(error){

      console.warn(
        '[Audit Log]',
        error.message
      );

    }

  }catch(error){

    console.warn(
      '[Audit Log]',
      error.message
    );

  }

}

   DEPARTMENTS
========================= */

async function loadDepartments(){

  if(!appState.supabase)return;


  try{

    const {data,error}=
      await appState.supabase
        .from('departments')
        .select('id,name')
        .order('name');


    if(error){

      console.warn(
        '[Departments]',
        error.message
      );

      return;

    }


    appState.departments={};


    (data||[]).forEach(d=>{

      appState.departments[d.id]=d.name;

    });


    populateDepartmentSelects();

  }catch(error){

    console.warn(
      '[Departments]',
      error.message
    );

  }

}


function populateDepartmentSelects(){

  const names=
    Object.values(appState.departments);


  const documentSelect=
    document.getElementById(
      'document-department'
    );

  const filterSelect=
    document.getElementById(
      'document-department-filter'
    );

  const userSelect=
    document.getElementById(
      'user-department'
    );


  if(documentSelect){

    const current=
      documentSelect.value;

    documentSelect.innerHTML=
      '<option value="">Select Department</option>'+
      names.map(name=>
        `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`
      ).join('');

    documentSelect.value=current;

  }


  if(filterSelect){

    const current=
      filterSelect.value;

    filterSelect.innerHTML=
      '<option value="">All Departments</option>'+
      names.map(name=>
        `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`
      ).join('');

    filterSelect.value=current;

  }


  if(userSelect){

    const current=
      userSelect.value;

    userSelect.innerHTML=
      '<option value="">Select Department</option>'+
      names.map(name=>
        `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`
      ).join('');

    userSelect.value=current;

  }

}


/* =========================
   DOCUMENTS
========================= */

async function loadDocuments(){

  if(!appState.supabase)return;


  const tbody=
    document.getElementById(
      'documents-tbody'
    );


  if(tbody){

    tbody.innerHTML=
      '<tr><td colspan="10" class="empty">Loading documents...</td></tr>';

  }


  try{

    const {data,error}=
      await appState.supabase
        .from('documents')
        .select('*')
        .order(
          'created_at',
          {ascending:false}
        );


    if(error)throw error;


    appState.documents=data||[];


    renderDocuments();

  }catch(error){

    console.error(
      '[Documents]',
      error.message
    );


    if(tbody){

      tbody.innerHTML=
        `<tr>
          <td colspan="10" class="empty">
            Unable to load documents:
            ${escapeHtml(error.message)}
          </td>
        </tr>`;

    }

  }

}


function renderDocuments(){

  const tbody=
    document.getElementById(
      'documents-tbody'
    );


  if(!tbody)return;


  const search=
    (
      document.getElementById(
        'document-search'
      )?.value||''
    ).toLowerCase();


  const type=
    document.getElementById(
      'document-type-filter'
    )?.value||'';


  const status=
    document.getElementById(
      'document-status-filter'
    )?.value||'';


  const approval=
    document.getElementById(
      'document-approval-filter'
    )?.value||'';


  const department=
    document.getElementById(
      'document-department-filter'
    )?.value||'';


  const filtered=
    appState.documents.filter(d=>{

      const text=[

        d.document_code,

        d.title,

        d.document_type,

        d.department,

        d.revision

      ]
      .join(' ')
      .toLowerCase();


      return(

        (!search||text.includes(search)) &&

        (!type||d.document_type===type) &&

        (!status||d.status===status) &&

        (!approval||d.approval_status===approval) &&

        (!department||d.department===department)

      );

    });


  if(!filtered.length){

    tbody.innerHTML=
      `<tr>
        <td colspan="10" class="empty">
          No documents found.
        </td>
      </tr>`;

    return;

  }


  tbody.innerHTML=
    filtered.map(d=>{

      const days=
        daysFromToday(d.review_date);


      let reviewText='—';


      if(days!==null){

        if(days<0)
          reviewText=
            `Overdue ${Math.abs(days)}d`;

        else if(days===0)
          reviewText='Due today';

        else
          reviewText=
            formatDate(d.review_date);

      }


      const canApprove=
        appState.role==='Super Admin' &&
        d.approval_status!=='Approved';


      return `

      <tr>

        <td>

          <div class="doc-title">
            ${escapeHtml(
              d.title||'Untitled'
            )}
          </div>

          <div class="doc-code">
            ${escapeHtml(
              d.document_code||'No code'
            )}
          </div>

        </td>

        <td>
          ${escapeHtml(
            d.document_type||'—'
          )}
        </td>

        <td>
          ${escapeHtml(
            d.department||'—'
          )}
        </td>

        <td>
          ${escapeHtml(
            d.revision||'—'
          )}
        </td>

        <td>
          ${formatDate(d.issue_date)}
        </td>

        <td>

          <span class="${reviewClass(d.review_date)}">
            ${escapeHtml(reviewText)}
          </span>

        </td>

        <td>

          <span class="${statusClass(d.status)}">
            ${escapeHtml(
              d.status||'Draft'
            )}
          </span>

        </td>

        <td>

          <span class="${approvalClass(d.approval_status)}">
            ${escapeHtml(
              d.approval_status||'Draft'
            )}
          </span>

        </td>

        <td>

          ${
            d.file_path

            ?

            `<button
              class="file-link"
              type="button"
              data-action="open-document-file"
              data-id="${escapeHtml(d.id)}">
              View
            </button>`

            :

            '<span class="muted">No file</span>'
          }

        </td>

        <td>

          <div class="action-buttons">

            <button
              type="button"
              data-action="edit-document"
              data-id="${escapeHtml(d.id)}">
              Edit
            </button>

            ${
              canApprove
              ?

              `<button
                type="button"
                class="approve"
                data-action="approve-document"
                data-id="${escapeHtml(d.id)}">
                Approve
              </button>`

              :

              ''
            }

            <button
              type="button"
              class="delete"
              data-action="delete-document"
              data-id="${escapeHtml(d.id)}">
              Delete
            </button>

          </div>

        </td>

      </tr>

      `;

    }).join('');

}


/* =========================
   DOCUMENT MODAL
========================= */

function openDocumentModal(documentId=null){

  appState.editingDocumentId=documentId;

  appState.oldDocumentPath=null;


  const modal=
    document.getElementById(
      'document-modal'
    );

  const form=
    document.getElementById(
      'document-form'
    );


  if(!modal||!form)return;


  form.reset();


  setStatus(
    'document-form-status',
    '',
    'info'
  );


  const fileInfo=
    document.getElementById(
      'current-file-info'
    );


  if(fileInfo)
    fileInfo.textContent='';


  if(documentId){

    const d=
      appState.documents.find(
        x=>x.id===documentId
      );


    if(!d)return;


    document.getElementById(
      'document-modal-title'
    ).textContent='Edit Document';


    document.getElementById(
      'document-code'
    ).value=d.document_code||'';


    document.getElementById(
      'document-type'
    ).value=d.document_type||'';


    document.getElementById(
      'document-title'
    ).value=d.title||'';


    document.getElementById(
      'document-department'
    ).value=d.department||'';


    document.getElementById(
      'document-revision'
    ).value=d.revision||'';


    document.getElementById(
      'document-issue-date'
    ).value=d.issue_date||'';


    document.getElementById(
      'document-review-date'
    ).value=d.review_date||'';


    document.getElementById(
      'document-status'
    ).value=d.status||'Draft';


    document.getElementById(
      'document-approval-status'
    ).value=d.approval_status||'Draft';


    document.getElementById(
      'document-description'
    ).value=d.description||'';


    appState.oldDocumentPath=
      d.file_path||null;


    if(fileInfo&&d.file_name){

      fileInfo.textContent=
        'Current file: '+d.file_name;

    }

  }else{

    document.getElementById(
      'document-modal-title'
    ).textContent='Add Document';

    document.getElementById(
      'document-status'
    ).value='Draft';

    document.getElementById(
      'document-approval-status'
    ).value='Draft';

  }


  modal.classList.add('active');

}


function closeDocumentModal(){

  const modal=
    document.getElementById(
      'document-modal'
    );

  if(modal)
    modal.classList.remove('active');


  appState.editingDocumentId=null;

  appState.oldDocumentPath=null;

}


function sanitizeFileName(name){

  return name
    .normalize('NFKD')
    .replace(/[^\w.\-]+/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_+|_+$/g,'');

}


async function uploadDocumentFile(
  file,
  documentCode
){

  if(!file)return null;


  const safeName=
    sanitizeFileName(file.name);


  const folder=
    sanitizeFileName(
      documentCode||'general'
    );


  const path=
    `documents/${folder}/${Date.now()}_${safeName}`;


  const {error}=
    await appState.supabase
      .storage
      .from('fsms-documents')
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:
            file.type||undefined
        }
      );


  if(error)throw error;


  return path;

}


async function removeStorageFile(path){

  if(!path)return;


  try{

    const {error}=
      await appState.supabase
        .storage
        .from('fsms-documents')
        .remove([path]);


    if(error){

      console.warn(
        '[Storage Remove]',
        error.message
      );

    }

  }catch(error){

    console.warn(
      '[Storage Remove]',
      error.message
    );

  }

}


async function handleDocumentSubmit(event){

  event.preventDefault();


  if(!appState.supabase)return;


  const code=
    document.getElementById(
      'document-code'
    ).value.trim();


  const type=
    document.getElementById(
      'document-type'
    ).value;


  const title=
    document.getElementById(
      'document-title'
    ).value.trim();


  const department=
    document.getElementById(
      'document-department'
    ).value||null;


  const revision=
    document.getElementById(
      'document-revision'
    ).value.trim()||null;


  const issueDate=
    document.getElementById(
      'document-issue-date'
    ).value||null;


  const reviewDate=
    document.getElementById(
      'document-review-date'
    ).value||null;


  const status=
    document.getElementById(
      'document-status'
    ).value;


  const approvalStatus=
    document.getElementById(
      'document-approval-status'
    ).value;


  const description=
    document.getElementById(
      'document-description'
    ).value.trim()||null;


  const file=
    document.getElementById(
      'document-file'
    ).files[0]||null;


  if(!code||!type||!title){

    setStatus(
      'document-form-status',
      'Document Code, Type and Title are required.',
      'error'
    );

    return;

  }


  try{

    setStatus(
      'document-form-status',
      'Saving document...',
      'info'
    );


    let uploadedPath=null;


    if(file){

      setStatus(
        'document-form-status',
        'Uploading file...',
        'info'
      );


      uploadedPath=
        await uploadDocumentFile(
          file,
          code
        );

    }


    const baseData={

      document_code:code,

      title,

      document_type:type,

      department,

      revision,

      issue_date:issueDate,

      review_date:reviewDate,

      status,

      approval_status:approvalStatus,

      description,

      updated_at:
        new Date().toISOString()

    };


    let savedId=null;


    if(appState.editingDocumentId){

      const old=
        appState.documents.find(
          d=>d.id===
            appState.editingDocumentId
        );


      const updateData={
        ...baseData
      };


      if(uploadedPath){

        updateData.file_path=
          uploadedPath;

        updateData.file_name=
          file.name;

        updateData.file_size=
          file.size;

        updateData.file_type=
          file.type||null;

      }


      const {data,error}=
        await appState.supabase
          .from('documents')
          .update(updateData)
          .eq(
            'id',
            appState.editingDocumentId
          )
          .select()
          .single();


      if(error){

        if(uploadedPath)
          await removeStorageFile(
            uploadedPath
          );

        throw error;

      }


      savedId=data.id;


      if(
        uploadedPath &&
        old?.file_path
      ){

        await removeStorageFile(
          old.file_path
        );

      }


      await writeAudit(
        'UPDATE',
        'Document Control',
        'documents',
        savedId,
        `Document updated: ${code}`,
        old||null,
        data||null
      );


      setStatus(
        'document-form-status',
        'Document updated successfully.',
        'success'
      );

    }else{

      const insertData={

        ...baseData,

        owner_id:
          appState.profile?.id||null,

        created_by:
          appState.profile?.id||null

      };


      if(uploadedPath){

        insertData.file_path=
          uploadedPath;

        insertData.file_name=
          file.name;

        insertData.file_size=
          file.size;

        insertData.file_type=
          file.type||null;

      }


      const {data,error}=
        await appState.supabase
          .from('documents')
          .insert(insertData)
          .select()
          .single();


      if(error){

        if(uploadedPath)
          await removeStorageFile(
            uploadedPath
          );

        throw error;

      }


      savedId=data.id;


      await writeAudit(
        'CREATE',
        'Document Control',
        'documents',
        savedId,
        `Document created: ${code}`,
        null,
        data
      );


      setStatus(
        'document-form-status',
        'Document created successfully.',
        'success'
      );

    }


    await loadDocuments();


    setTimeout(
      closeDocumentModal,
      600
    );

  }catch(error){

    console.error(
      '[Document Save]',
      error
    );


    setStatus(
      'document-form-status',
      'Error: '+
      (error.message||
       'Unable to save document.'),
      'error'
    );

  }

}

    appState.documents.find(

    );

  const confirmed=
    confirm(
      `Approve this document?\n\n${

  if(!confirmed)return;


  try{

async function queryCount(
  table,
  filter=null
){

  if(!appState.supabase)
    return null;


  try{

    let query=
      appState.supabase
        .from(table)
        .select(
          '*',
          {
            count:'exact',
            head:true
          }
        );


    if(filter)
      query=filter(query);


    const {count,error}=
      await query;


    if(error){

      console.warn(
        `[Dashboard] ${table}:`,
        error.message
      );

      return null;

    }


    return safeNumber(count);

  }catch(error){

    console.warn(
      `[Dashboard] ${table}:`,
      error.message
    );

    return null;

  }

}

async function refreshDashboard(){

  if(
    !appState.supabase ||
    appState.dashboardLoading
  )
    return;


  appState.dashboardLoading=true;


  try{

    const today=
      todayIso();


    const next30Date=
      new Date();


    next30Date.setDate(
      next30Date.getDate()+30
    );


    const next30=
      next30Date
        .toISOString()
        .slice(0,10);


    const [

      totalDocuments,

      pendingDocuments,

      nearReview,

      approvedDocuments,

      activePlans,

      openTasks

    ]=await Promise.all([

      queryCount('documents'),

      queryCount(
        'documents',
        q=>q.in(
          'approval_status',
          [
            'Draft',
            'Pending Approval',
            'Rejected'
          ]
        )
      ),

      queryCount(
        'documents',
        q=>
          q.gte(
            'review_date',
            today
          )
          .lte(
            'review_date',
            next30
          )
          .neq(
            'status',
            'Obsolete'
          )
      ),

      queryCount(
        'documents',
        q=>q.eq(
          'approval_status',
          'Approved'
        )
      ),

      queryCount(
        'compliance_plans',
        q=>q.eq(
          'status',
          'Active'
        )
      ),

      queryCount(
        'compliance_tasks',
        q=>q.in(
          'status',
          [
            'Pending',
            'In Progress',
            'Overdue'
          ]
        )
      )

    ]);


    setKpiValue(
      'kpi-total-documents',
      totalDocuments
    );


    setKpiValue(
      'kpi-pending-documents',
      pendingDocuments
    );


    setKpiValue(
      'kpi-documents-near-review',
      nearReview
    );


    setKpiValue(
      'kpi-open-tasks',
      openTasks
    );


    setKpiValue(
      'kpi-active-plans',
      activePlans
    );


    setKpiValue(
      'kpi-approved-documents',
      approvedDocuments
    );


    setText(
      'kpi-total-documents-sub',
      totalDocuments===null
        ?'Unable to read'
        :'Live data connected'
    );


    setText(
      'kpi-pending-documents-sub',
      pendingDocuments===null
        ?'Unable to read'
        :pendingDocuments
          ?'Requires action'
          :'No pending approval'
    );


    setText(
      'kpi-documents-near-review-sub',
      nearReview===null
        ?'Unable to read'
        :nearReview
          ?'Due within 30 days'
          :'No reviews due soon'
    );


    setText(
      'kpi-open-tasks-sub',
      openTasks===null
        ?'Unable to read'
        :openTasks
          ?'Needs action'
          :'No open tasks'
    );


    setText(
      'kpi-active-plans-sub',
      activePlans===null
        ?'Unable to read'
        :'Active compliance plans'
    );


    setText(
      'kpi-approved-documents-sub',
      approvedDocuments===null
        ?'Unable to read'
        :'Controlled documents'
    );


    let documentControl=0;


    if(
      totalDocuments!==null &&
      totalDocuments>0 &&
      approvedDocuments!==null
    ){

      documentControl=
        Math.round(
          approvedDocuments/
          totalDocuments*
          100
        );

    }


    setKpiValue(
      'kpi-document-control',
      documentControl+'%'
    );


    let planCoverage=0;


    if(
      activePlans!==null
    ){

      planCoverage=
        activePlans>0
          ?100
          :0;

    }


    setKpiValue(
      'kpi-plan-coverage',
      planCoverage+'%'
    );


    let taskCompletion=0;


    if(
      openTasks!==null
    ){

      const [
        completed,
        totalTasks
      ]=await Promise.all([

        queryCount(
          'compliance_tasks',
          q=>q.eq(
            'status',
            'Completed'
          )
        ),

        queryCount(
          'compliance_tasks'
        )

      ]);


      if(
        totalTasks!==null &&
        totalTasks>0 &&
        completed!==null
      ){

        taskCompletion=
          Math.round(
            completed/
            totalTasks*
            100
          );

      }

    }


    setKpiValue(
      'kpi-task-completion',
      taskCompletion+'%'
    );


    setText(
      'kpi-audit-trail',
      'Ready'
    );


    let readiness=0;


    if(
      totalDocuments!==null
    ){

      const docScore=
        totalDocuments>0
          ?documentControl
          :0;


      const reviewScore=
        totalDocuments>0 &&
        nearReview!==null

          ?

          Math.max(
            0,
            100-
            Math.min(
              100,
              nearReview/
              totalDocuments*
              100
            )
          )

          :

          0;


      readiness=
        Math.round(
          (
            docScore+
            reviewScore
          )/2
        );

    }


    setKpiValue(
      'kpi-audit-readiness',
      readiness+'%'
    );


    const draft=
      await queryCount(
        'documents',
        q=>q.eq(
          'approval_status',
          'Draft'
        )
      );


    const review=
      await queryCount(
        'documents',
        q=>q.eq(
          'approval_status',
          'Pending Approval'
        )
      );


    updateChart(
      'chart-draft',
      totalDocuments||0,
      draft
    );


    updateChart(
      'chart-review',
      totalDocuments||0,
      review
    );


    updateChart(
      'chart-approved',
      totalDocuments||0,
      approvedDocuments
    );


    updateChart(
      'chart-near',
      totalDocuments||0,
      nearReview
    );


    updateChart(
      'chart-tasks',
      openTasks||0,
      openTasks
    );


    renderAttention(
      nearReview,
      pendingDocuments,
      openTasks
    );

  }catch(error){

    console.error(
      '[Dashboard]',
      error
    );

  }finally{

    appState.dashboardLoading=false;

  }

}


function setKpiValue(id,value){

  const el=
    document.getElementById(id);

  if(el){

    el.textContent=
      value===null
        ?'—'
        :value;

  }

}


function setText(id,value){

  const el=
    document.getElementById(id);

  if(el)
    el.textContent=value;

}


function updateChart(
  id,
  total,
  value
){

  const el=
    document.getElementById(id);


  if(!el)return;


  if(
    !total ||
    value===null
  ){

    el.style.height='15%';

    return;

  }


  const percentage=
    Math.max(
      10,
      Math.min(
        100,
        value/
        total*
        100
      )
    );


  el.style.height=
    percentage+'%';

}


function renderAttention(
  nearReview,
  pendingDocuments,
  openTasks
){

  const box=
    document.getElementById(
      'attention-list'
    );


  if(!box)return;


  const items=[];


  if(pendingDocuments){

    items.push(`

      <div class="issue">

        <i class="dot bad"></i>

        <div>

          <b>Document Approval</b>

          <span>
            ${pendingDocuments}
            document(s) require approval
          </span>

        </div>

        <span class="pill warn">
          Action
        </span>

      </div>

    `);

  }


  if(nearReview){

    items.push(`

      <div class="issue">

        <i class="dot"></i>

        <div>

          <b>Document Review</b>

          <span>
            ${nearReview}
            document(s) due within 30 days
          </span>

        </div>

        <span class="pill warn">
          Due Soon
        </span>

      </div>

    `);

  }


  if(openTasks){

    items.push(`

      <div class="issue">

        <i class="dot bad"></i>

        <div>

          <b>Compliance Tasks</b>

          <span>
            ${openTasks}
            open task(s)
          </span>

        </div>

        <span class="pill bad">
          Open
        </span>

      </div>

    `);

  }


  if(!items.length){

    items.push(`

      <div class="issue">

        <i class="dot good"></i>

        <div>

          <b>
            No Critical Attention Items
          </b>

          <span>
            Current system data shows no open alerts
          </span>

        </div>

        <span class="pill">
          OK
        </span>

      </div>

    `);

  }


  box.innerHTML=
    items.join('');

}

async function loadUsers(){

  if(!appState.supabase)return;


  try{

    await loadDepartments();


    const {data,error}=
      await appState.supabase
        .from('profiles')
        .select(
          'id,full_name,email,employee_code,department_id,role,job_title,phone,status'
        )
        .order('full_name');


    if(error)throw error;


    appState.users=
      data||[];


    renderUsersTable();

  }catch(error){

    console.error(
      '[Users]',
      error.message
    );


    const tbody=
      document.getElementById(
        'users-tbody'
      );


    if(tbody){

      tbody.innerHTML=
        `<tr>

          <td
            colspan="7"
            style="
              text-align:center;
              padding:20px;
              color:var(--bad);">

            Unable to load users:
            ${escapeHtml(error.message)}

          </td>

        </tr>`;

    }

  }

}


function renderUsersTable(){

  const tbody=
    document.getElementById(
      'users-tbody'
    );


  if(!tbody)return;


  const text=
    (
      document.getElementById(
        'users-filter'
      )?.value||''
    ).toLowerCase();


  const role=
    document.getElementById(
      'role-filter'
    )?.value||'';


  const filtered=
    appState.users.filter(u=>{

      const haystack=[

        u.full_name,

        u.email,

        u.employee_code,

        u.role,

        u.job_title

      ]
      .join(' ')
      .toLowerCase();


      return(

        (!text||
         haystack.includes(text))&&

        (!role||
         u.role===role)

      );

    });


  if(!filtered.length){

    tbody.innerHTML=
      `<tr>

        <td
          colspan="7"
          style="
            text-align:center;
            padding:20px;
            color:var(--muted);">

          No users found

        </td>

      </tr>`;

    return;

  }


  tbody.innerHTML=
    filtered.map(user=>`

      <tr>

        <td>

          <b>
            ${escapeHtml(
              user.full_name||'N/A'
            )}
          </b>

          <div class="helper">
            ${escapeHtml(
              user.job_title||''
            )}
          </div>

        </td>

        <td>
          ${escapeHtml(
            user.email||'N/A'
          )}
        </td>

        <td>
          ${escapeHtml(
            user.employee_code||'N/A'
          )}
        </td>

        <td>
          ${escapeHtml(
            appState.departments[
              user.department_id
            ]||'N/A'
          )}
        </td>

        <td>
          ${escapeHtml(
            user.role||'N/A'
          )}
        </td>

        <td>

          <span
            class="user-status ${
              escapeHtml(
                user.status||'inactive'
              )
            }">

            ${escapeHtml(
              user.status||'unknown'
            )}

          </span>

        </td>

        <td>

          <div class="action-buttons">

            <button
              type="button"
              data-action="edit-user"
              data-id="${escapeHtml(user.id)}">

              Edit

            </button>

            <button
              type="button"
              data-action="toggle-user"
              data-id="${escapeHtml(user.id)}"
              data-status="${escapeHtml(user.status||'inactive')}">

              ${
                user.status==='active'
                  ?'Deactivate'
                  :'Activate'
              }

            </button>

          </div>

        </td>

      </tr>

    `).join('');

}

    ).value;

    );

    'login-status',

  try{

    const {data,error}=
      await appState.supabase.auth
        .signInWithPassword({

          email,

          password

        });


    if(error)throw error;


    appState.session=
      data.session;


    await loadProfile(
      data.user
    );


    await loadDepartments();


    showDashboard();


    switchModule('dashboard');


    setStatus(
      'login-status',
      'Signed in successfully.',
      'success'
    );

  }catch(error){

    setStatus(
      'login-status',
      error.message||
      'Unable to sign in.',
      'error'
    );

  }

}


async function handleForgotPassword(){

  const email=
    document.getElementById(
      'login-email'
    ).value.trim();


  if(!email){

    setStatus(
      'login-status',
      'Enter your email first.',
      'error'
    );

    return;

  }


  try{

    const {error}=
      await appState.supabase.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              `${window.location.origin}${window.location.pathname}`
          }
        );


    if(error)throw error;


    setStatus(
      'login-status',
      'Password reset instructions sent.',
      'success'
    );

  }catch(error){

    setStatus(
      'login-status',
      error.message,
      'error'
    );

  }

}


async function handleSignOut(){

  if(!appState.supabase)return;


  try{

    await appState.supabase.auth.signOut();

  }catch(error){

    console.warn(
      '[Sign Out]',
      error.message
    );

  }


  appState.session=null;

  appState.profile=null;

  appState.role=
    'Auditor / Read Only';

  appState.currentModule=
    'dashboard';


  showLogin();

}


/* =========================
   GLOBAL SEARCH
========================= */

function filterCurrentModule(value){

  const query=
    (value||'').toLowerCase();


  if(
    appState.currentModule===
    'documents'
  ){

    const input=
      document.getElementById(
        'document-search'
      );


    if(input){

      input.value=value;

      renderDocuments();

    }


    return;

  }


  if(
    appState.currentModule===
    'user-management'
  ){

    const input=
      document.getElementById(
        'users-filter'
      );


    if(input){

      input.value=value;

      renderUsersTable();

    }

  }

}


/* =========================
   SESSION
========================= */

async function initializeSession(){

  if(
    !appState.supabase ||
    appState.loadingSession
  )
    return;


  appState.loadingSession=true;


  try{

    const {
      data:{session},
      error
    }=
      await appState.supabase.auth
        .getSession();


    if(error){

      console.warn(
        '[Session]',
        error.message
      );

    }


    if(!session){

      showLogin();

      return;

    }


    appState.session=session;


    await loadProfile(
      session.user
    );


    await loadDepartments();


    showDashboard();


    switchModule('dashboard');

  }catch(error){

    console.error(
      '[Session]',
      error
    );

    showLogin();

  }finally{

    appState.loadingSession=false;

  }

}


/* =========================
   EVENT DELEGATION
   THIS FIXES SIDEBAR
========================= */

function setupNavigation(){

  document.addEventListener(
    'click',
    function(event){

      const button=
        event.target.closest(
          '.nav[data-module]'
        );


      if(!button)return;


      event.preventDefault();


      if(button.disabled)
        return;


      const module=
        button.dataset.module;


      if(!module)return;


      switchModule(module);

    }
  );

}


/* =========================
   ACTION DELEGATION
========================= */

function setupActionDelegation(){

  document.addEventListener(
    'click',
    function(event){

      const target=
        event.target.closest(
          '[data-action]'
        );


      if(!target)return;


      const action=
        target.dataset.action;


      const id=
        target.dataset.id;


      if(action==='edit-document'){

        editDocument(id);

      }


      else if(
        action==='delete-document'
      ){

        deleteDocument(id);

      }


      else if(
        action==='approve-document'
      ){

        approveDocument(id);

      }


      else if(
        action==='open-document-file'
      ){

        openDocumentFile(id);

      }


      else if(action==='edit-user'){

        editUser(id);

      }


      else if(action==='toggle-user'){

        toggleUserStatus(
          id,
          target.dataset.status
        );

      }

    }
  );

}


/* =========================
   EVENTS
========================= */

  /* Login */

  document

  document

    );


  document
    .getElementById(
      'role-filter'
    )
    ?.addEventListener(

    );


  /* Document Form */

  document
    .getElementById(
      'document-form'
    )
    ?.addEventListener(

      handleDocumentSubmit
    );


  /* Document Filters */

  document
    .getElementById(
      'document-search'
    )
    ?.addEventListener(

      renderDocuments
    );


  document
    .getElementById(
      'document-type-filter'
    )
    ?.addEventListener(
      'change',
      renderDocuments
    );


  document
    .getElementById(
      'document-status-filter'
    )
    ?.addEventListener(
      'change',
      renderDocuments
    );


  document
    .getElementById(
      'document-approval-filter'
    )
    ?.addEventListener(
      'change',
      renderDocuments
    );


  document
    .getElementById(
      'document-department-filter'
    )
    ?.addEventListener(
      'change',
      renderDocuments
    );


  /* Global Search */

  document
    .getElementById(

    )
    ?.addEventListener(

          event.target.value
        )
    );

}


/* =========================
   GLOBAL FUNCTIONS
========================= */

  window.switchModule=
    switchModule;

  window.openDocumentModal=

  window.editDocument=

    deleteDocument;

    approveDocument;

  window.openDocumentFile=
    openDocumentFile;

  window.loadDocuments=
    loadDocuments;

  window.refreshDashboard=
    refreshDashboard;

  window.openUserModal=
    openUserModal;

  window.toggleUserStatus=

/* =========================
   AUTH STATE LISTENER
========================= */

function setupAuthListener(){

  appState.supabase.auth
    .onAuthStateChange(
      async(_event,session)=>{

        console.log(
          '[Auth]',
          _event
        );


        /*
          Ignore duplicate INITIAL_SESSION
          work when initializeSession()
          is already processing it.
        */

        if(
          _event==='INITIAL_SESSION'
        ){

          return;

        }


        if(session){

          appState.session=
            session;


          await loadProfile(
            session.user
          );


          await loadDepartments();


          showDashboard();


          if(
            appState.currentModule
          ){

            switchModule(
              appState.currentModule
            );

          }else{

            switchModule(
              'dashboard'
            );

          }

        }else{

          appState.session=null;

          appState.profile=null;

          appState.role=
            'Auditor / Read Only';


          showLogin();

        }

      }
    );

}


/* =========================
   INIT
========================= */

async function init(){

  if(appState.initialized)
    return;


  appState.initialized=true;


  console.log(
    '[INIT] Starting Pure Ice FSMS...'
  );


  if(
    !window.PURE_ICE_CONFIG||
    !window.PURE_ICE_CONFIG.supabaseUrl||
    !window.PURE_ICE_CONFIG.supabaseAnonKey
  ){

    setStatus(
      'login-status',
      'Supabase configuration is missing. Check config.js.',
      'error'
    );

    return;

  }


  try{

    appState.supabase=
      window.supabase.createClient(
        window.PURE_ICE_CONFIG.supabaseUrl,
        window.PURE_ICE_CONFIG.supabaseAnonKey
      );


    setupEvents();

    setupNavigation();

    setupActionDelegation();

    exposeGlobalFunctions();

    setupAuthListener();


    await initializeSession();


    console.log(
      '[INIT] Pure Ice FSMS ready.'
    );

  }catch(error){

    console.error(
      '[INIT] Fatal error:',
      error
    );


    setStatus(
      'login-status',
      'System initialization failed: '+
      error.message,
      'error'
    );

  }

}


/* =========================
   START
========================= */

if(
  document.readyState===
  'loading'
){

  document.addEventListener(
    'DOMContentLoaded',
    init,
    {once:true}
  );

}else{

  init();

}

</script>
